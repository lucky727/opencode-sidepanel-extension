<!DOCTYPE html>
<html style="height:100%;margin:0;padding:0">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0b0b0b; }
    iframe { width: 100%; height: 100%; border: none; }
    .overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #0b0b0b;
      color: #888; font-size: 12px; z-index: 10; transition: opacity .3s;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 20px; height: 20px; border: 2px solid #222; border-top-color: #888; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="overlay" id="overlay">
    <div class="spinner"></div>
    <div id="overlayMsg">Connecting…</div>
  </div>
  <iframe id="frame" src="http://127.0.0.1:4096/"></iframe>
  <script src="panel.js"></script>
</body>
</html>
